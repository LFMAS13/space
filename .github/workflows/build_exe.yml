name: Crear Ejecutable Windows (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón en GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.12 en Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Instalar librerías y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install bleak aiohttp pyinstaller

      - name: 4. Empaquetar XOSS_Monitor.exe
        run: |
          pyinstaller --noconfirm --onefile --name "XOSS_Monitor" --add-data "dashboard.html;." --collect-all bleak xoss_server.py

      - name: 5. Subir el archivo .exe listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: XOSS_Monitor_Windows
          path: dist/XOSS_Monitor.exe
